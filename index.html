<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Landing | UFPSO</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <!-- PANTALLA DE CARGA -->
    <div id="loader" class="loader">
        <section class="loading" role="status">
            <h2>Welcome to my website</h2>
            <span class="loading__author">Your friends at UFPSO</span>
            <span class="loading__anim" aria-hidden="true"></span>
        </section>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
     <div id="website" class="website" inert>

        <header class="header">
            <nav class="navbar container">
                <a href="#home" class="logo">
                    UFPSO<span>.dev</span>
                </a>

                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#services">Services</a></li>
                </ul>
            </nav>
        </header>

        <main>
            
            <!-- HERO -->
             <section id="home" class="hero">
                <div class="container hero-content">
                    <span class="subtitle">Learning web development</span>
                    <h1>Build something <span>amazing.</span></h1>
                    <p>Welcome to my website! I'm excited to share my journey in web development with you.</p>

                    <a href="#services" class="btn">Explore Services</a>
                </div>
             </section>
        </main>
     </div>
</body>

</html>
